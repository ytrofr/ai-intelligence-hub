<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adoption Radar — AI Intelligence Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
        font-size: var(--font-base);
        line-height: 1.55;
        padding: var(--spacing-xl) var(--spacing-lg) 4rem;
      }
      a { color: var(--color-primary-hover); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .wrap { max-width: 1080px; margin: 0 auto; }

      /* Header */
      .radar-head {
        border-left: 4px solid var(--color-primary);
        padding-left: var(--spacing-lg);
        margin-bottom: var(--spacing-xl);
      }
      .radar-head .eyebrow {
        font-family: var(--font-mono);
        font-size: var(--font-xs);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--color-primary-hover);
      }
      .radar-head h1 { font-size: var(--font-2xl); margin: var(--spacing-xs) 0; }
      .radar-head p { color: var(--color-text-muted); font-size: var(--font-sm); max-width: 70ch; }
      .backlink { font-size: var(--font-sm); font-family: var(--font-mono); }

      /* Summary stat strip */
      .stat-strip {
        display: flex; flex-wrap: wrap; gap: var(--spacing-md);
        margin: var(--spacing-lg) 0 var(--spacing-xl);
      }
      .stat {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--spacing-md) var(--spacing-lg);
        min-width: 120px; flex: 1;
      }
      .stat .num { font-size: var(--font-xl); font-weight: 700; font-family: var(--font-mono); }
      .stat .lbl { font-size: var(--font-xs); color: var(--color-text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
      .stat.adopt .num { color: var(--color-success); }
      .stat.watch .num { color: var(--color-warning); }
      .stat.skip .num { color: var(--color-text-dim); }

      /* Topic section */
      .topic { margin-bottom: var(--spacing-xl); }
      .topic-head { display: flex; align-items: baseline; gap: var(--spacing-md); margin-bottom: var(--spacing-xs); }
      .topic-head h2 { font-size: var(--font-lg); }
      .topic-head .badge-count {
        font-family: var(--font-mono); font-size: var(--font-xs);
        background: var(--color-surface); border: 1px solid var(--color-border);
        border-radius: var(--radius-full); padding: 2px 10px; color: var(--color-text-muted);
      }
      .topic-blurb { color: var(--color-text-dim); font-size: var(--font-sm); margin-bottom: var(--spacing-md); }
      .tier-label {
        font-family: var(--font-mono); font-size: var(--font-xs);
        text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-dim);
        margin: var(--spacing-md) 0 var(--spacing-sm);
      }

      /* Repo card */
      .repo {
        display: grid; grid-template-columns: 86px 1fr; gap: var(--spacing-md);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-left: 3px solid var(--color-border-hover);
        border-radius: var(--radius-md);
        padding: var(--spacing-md);
        margin-bottom: var(--spacing-sm);
      }
      .repo:hover { background: var(--color-surface-hover); }
      .repo.v-ADOPT { border-left-color: var(--color-success); }
      .repo.v-WATCH { border-left-color: var(--color-warning); }
      .repo.v-SKIP  { border-left-color: var(--color-text-dim); opacity: 0.78; }

      .repo .stars {
        font-family: var(--font-mono); font-weight: 600;
        text-align: center; align-self: center; color: var(--color-warning);
      }
      .repo .stars .k { display: block; font-size: var(--font-md); }
      .repo .stars .star-ico { font-size: var(--font-xs); color: var(--color-text-dim); }

      .repo .body { min-width: 0; }
      .repo .name-row { display: flex; align-items: center; gap: var(--spacing-sm); flex-wrap: wrap; }
      .repo .name { font-family: var(--font-mono); font-weight: 600; font-size: var(--font-sm); }
      .verdict {
        font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600;
        letter-spacing: 0.08em; padding: 2px 8px; border-radius: var(--radius-sm);
      }
      .verdict.ADOPT { background: rgba(34,197,94,0.16); color: var(--color-success); }
      .verdict.WATCH { background: rgba(245,158,11,0.16); color: var(--color-warning); }
      .verdict.SKIP  { background: rgba(113,128,150,0.16); color: var(--color-text-dim); }
      .repo .desc { color: var(--color-text-dim); font-size: var(--font-xs); margin: 3px 0 6px; }
      .repo .why {
        font-size: var(--font-sm); color: var(--color-text);
        border-top: 1px dashed var(--color-border); padding-top: 6px;
      }
      .repo .why b { color: var(--color-primary-hover); font-weight: 600; }
      .not-indexed { font-size: 0.7rem; color: var(--color-text-dim); font-family: var(--font-mono); }

      /* Needs review */
      .review-section { margin-top: 2.5rem; border-top: 1px solid var(--color-border); padding-top: var(--spacing-lg); }
      .review-toggle {
        cursor: pointer; font-size: var(--font-md); font-weight: 600;
        display: flex; align-items: center; gap: var(--spacing-sm);
      }
      .review-toggle .chev { transition: transform var(--transition-fast); color: var(--color-text-dim); }
      .review-toggle.open .chev { transform: rotate(90deg); }
      .review-grid { display: none; margin-top: var(--spacing-md); }
      .review-grid.open { display: block; }
      .review-row {
        display: grid; grid-template-columns: 70px 110px 1fr; gap: var(--spacing-md);
        padding: 8px var(--spacing-sm); border-bottom: 1px solid var(--color-border);
        font-size: var(--font-sm); align-items: center;
      }
      .review-row .rev-stars { font-family: var(--font-mono); color: var(--color-warning); }
      .review-row .rev-topic { font-family: var(--font-mono); font-size: var(--font-xs); color: var(--color-text-dim); }
      .review-row .rev-desc { color: var(--color-text-dim); font-size: var(--font-xs); }

      .foot { margin-top: 2.5rem; color: var(--color-text-dim); font-size: var(--font-xs); font-family: var(--font-mono); }
      .loading, .error { padding: 3rem; text-align: center; color: var(--color-text-muted); }
      .error { color: var(--color-error); }
      @media (max-width: 640px) {
        .repo { grid-template-columns: 64px 1fr; }
        .review-row { grid-template-columns: 60px 1fr; }
        .review-row .rev-desc { display: none; }
      }
    
      .project-bar { display: flex; align-items: center; gap: 0.75rem; margin: 0.5rem 0 1rem; }
      .project-bar select { background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border); border-radius: 6px; padding: 0.35rem 0.6rem; font-family: var(--font-mono); font-size: var(--font-sm); }
      .status-row { display: flex; gap: 0.35rem; align-items: center; margin-top: 0.4rem; flex-wrap: wrap; }
      .status-lbl { font-size: 0.7rem; color: var(--color-text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-right: 0.2rem; }
      .status-btn { font-family: var(--font-mono); font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 999px; border: 1px solid var(--color-border); background: transparent; color: var(--color-text-dim); cursor: pointer; }
      .status-btn.on { border-style: double; border-width: 3px; color: var(--color-text); font-weight: 700; }
      .status-btn:hover { background: var(--color-surface-hover); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="backlink" href="/">&larr; AI Intelligence Hub</a>
      <div class="project-bar">
        <label for="project-select" class="eyebrow">Project</label>
        <select id="project-select"></select>
      </div>
      <div id="root"><div class="loading">Loading radar…</div></div>
    </div>

    <style>
      .close-form { margin-top:.55rem; padding:.6rem .7rem; border:1px solid currentColor;
                    border-radius:8px; display:flex; flex-direction:column; gap:.4rem; opacity:.95; }
      .close-q { font-size:.82rem; }
      .close-form input { padding:.35rem .5rem; font:inherit; font-size:.82rem;
                          border:1px solid var(--color-border, #999); border-radius:5px;
                          background:transparent; color:inherit; }
      .close-actions { display:flex; gap:.4rem; }
      .close-form button { font:inherit; font-size:.78rem; padding:.25rem .7rem; cursor:pointer;
                           border:1px solid currentColor; border-radius:5px; background:transparent; color:inherit; }
      .cf-err:empty { display:none; }
      .cf-err { font-size:.78rem; font-weight:600; text-decoration:underline; text-underline-offset:3px; }
      .upstream { display:flex; align-items:center; gap:.5rem; margin-top:.4rem;
                  font-size:.82rem; letter-spacing:.01em; }
      .upstream .up-mark { font-weight:700; }
      .upstream .up-lbl { text-transform:uppercase; opacity:.55; font-size:.7rem;
                          letter-spacing:.08em; }
      .upstream .up-val { font-variant-numeric:tabular-nums; }
      /* Shape and weight carry the meaning; the tints are a second channel only. */
      .tone-alarm   .up-val { font-weight:700; text-decoration:underline; text-underline-offset:3px; }
      .tone-alarm   { color:#b3261e; }
      .tone-warn    .up-val { font-weight:600; }
      .tone-warn    { color:#8a6100; }
      .tone-ok      { opacity:.72; }
      .tone-unknown { opacity:.45; font-style:italic; }
      @media (prefers-color-scheme: dark) {
        .tone-alarm { color:#f2b8b5; } .tone-warn { color:#e0c07a; }
      }
    </style>
    <script>
      const fmtStars = (n) => {
        if (n === null || n === undefined) return "—";
        if (n >= 1000) return (n / 1000).toFixed(n >= 100000 ? 0 : 1) + "k";
        return String(n);
      };
      const esc = (s) =>
        String(s || "").replace(/[&<>"]/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );

      // Upstream state, shown where the adopt/skip decision is actually made.
      // Marker is a SHAPE first (the palette is a second channel, never the only
      // one) and the text always says which state it is in.
      function upstreamLine(u) {
        if (!u) return "";
        return `<div class="upstream tone-${esc(u.tone)}">
            <span class="up-mark">${esc(u.mark)}</span>
            <span class="up-lbl">upstream</span>
            <span class="up-val">${esc(u.label)}</span>
          </div>`;
      }

      function repoCard(r) {
        return `
          <div class="repo v-${r.verdict}">
            <div class="stars">
              <span class="k">${fmtStars(r.stars)}</span>
              <span class="star-ico">${r.inIndex ? "★ stars" : "not indexed"}</span>
            </div>
            <div class="body">
              <div class="name-row">
                <a class="name" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.repo)}</a>
                <span class="verdict ${r.verdict}">${r.verdict}</span>
              </div>
              <div class="desc">${esc(r.description) || "<span class='not-indexed'>no description in index</span>"}</div>
              <div class="why"><b>Why:</b> ${esc(r.why || r.rationale)}</div>
              ${upstreamLine(r.upstream)}
              <div class="status-row">
                <span class="status-lbl">status</span>
                ${STATUSES.map((st) => `<button class="status-btn ${r.status === st ? "on" : ""}" data-repo="${esc(r.repo)}" data-status="${st}">${st}</button>`).join("")}
              </div>
              <div class="repo-close" data-repo="${esc(r.repo)}"></div>
            </div>
          </div>`;
      }
      const STATUSES = ["proposed", "accepted", "done", "rejected"];
      let CURRENT_PROJECT = new URLSearchParams(location.search).get("project") || "apollo";

      function topicSection(t) {
        if (t.count === 0) return "";
        const tier = (label, repos) =>
          repos.length
            ? `<div class="tier-label">${label} — ${repos.length}</div>` +
              repos.map(repoCard).join("")
            : "";
        return `
          <section class="topic">
            <div class="topic-head">
              <h2>${esc(t.label)}</h2>
              <span class="badge-count">${t.count} curated</span>
            </div>
            <div class="topic-blurb">${esc(t.blurb)}</div>
            ${tier("★ " + fmtStars(THRESHOLD) + "+ stars", t.top)}
            ${tier("High relevance · under " + fmtStars(THRESHOLD), t.sub)}
          </section>`;
      }

      let THRESHOLD = 20000;
      function render(d) {
        THRESHOLD = d.starThreshold || 20000;
        const s = d.summary;
        const topicLabel = Object.fromEntries(
          d.topics.map((t) => [t.id, t.label]),
        );
        const reviewRows = d.needsReview
          .map(
            (r) => `
            <div class="review-row">
              <span class="rev-stars">${fmtStars(r.stars)}</span>
              <span class="rev-topic">${esc(topicLabel[r.topic] || r.topic).split(" ")[0]}</span>
              <span>
                <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>
                <span class="rev-desc"> — ${esc((r.description || "").slice(0, 110))}</span>
              </span>
            </div>`,
          )
          .join("");

        document.getElementById("root").innerHTML = `
          <div class="radar-head">
            <div class="eyebrow">Adoption Radar</div>
            <h1>${esc(d.title || d.project)} Radar</h1>
            <p>${esc(d.subtitle)}</p>
          </div>
          <div class="stat-strip">
            <div class="stat"><div class="num">${s.curated}</div><div class="lbl">Curated repos</div></div>
            <div class="stat adopt"><div class="num">${s.adopt}</div><div class="lbl">Adopt</div></div>
            <div class="stat watch"><div class="num">${s.watch}</div><div class="lbl">Watch</div></div>
            <div class="stat skip"><div class="num">${s.skip}</div><div class="lbl">Skip</div></div>
            <div class="stat"><div class="num">${s.accepted + s.done}</div><div class="lbl">Accepted / done</div></div>
            <div class="stat"><div class="num">${s.topTier}</div><div class="lbl">★ ${fmtStars(d.starThreshold)}+</div></div>
            <div class="stat"><div class="num">${s.needsReview}</div><div class="lbl">Needs review</div></div>
          </div>
          ${d.topics.map(topicSection).join("")}
          <div class="review-section">
            <div class="review-toggle" id="rev-toggle">
              <span class="chev">▶</span>
              <span>Needs Review — ${s.needsReview} uncurated ${fmtStars(d.starThreshold)}+ repos matching ${esc(d.title || d.project)} topics</span>
            </div>
            <div class="review-grid" id="rev-grid">${reviewRows || "<p class='topic-blurb'>None.</p>"}</div>
          </div>
          <div class="foot">
            Verdicts — ADOPT: ${esc(d.verdicts.ADOPT)} · WATCH: ${esc(d.verdicts.WATCH)} · SKIP: ${esc(d.verdicts.SKIP)}<br/>
            Curated audit ${esc(d.updated)} · live data generated ${esc(d.generatedAt)} · star threshold ${d.starThreshold.toLocaleString()}
          </div>`;

        const toggle = document.getElementById("rev-toggle");
        const grid = document.getElementById("rev-grid");
        toggle.addEventListener("click", () => {
          toggle.classList.toggle("open");
          grid.classList.toggle("open");
        });
        document.querySelectorAll(".status-btn").forEach((b) =>
          b.addEventListener("click", () => setStatus(b.dataset.repo, b.dataset.status)),
        );
        if (!d.summary.curated) {
          document.getElementById("root").insertAdjacentHTML("beforeend",
            `<div class="empty">No verdict rows yet for <b>${esc(d.title || d.project)}</b> — the Phase B adoption dossier fills this radar.</div>`);
        }
      }

      // done and rejected CLOSE a row, and a closed row needs evidence and a
      // lesson. The buttons used to look uniform and all four posted the same
      // bare payload, so clicking "done" hit the server gate and failed with a
      // raw alert - the layer that gained the rule did not bring its one caller
      // along. Closing now asks for what it needs, inline, before posting.
      const CLOSING = new Set(["done", "rejected"]);

      function closeForm(repo, status) {
        const card = document.querySelector(`.repo-close[data-repo="${CSS.escape(repo)}"]`);
        if (!card) return;
        const isDone = status === "done";
        card.innerHTML = `
          <div class="close-form">
            <div class="close-q">Closing as <b>${status}</b> — what settled it?</div>
            <input class="cf-ev" placeholder="${isDone ? "commit, PR or URL — apollo@3f9a12c" : "commit, PR, URL or a report path"}" />
            <input class="cf-le" placeholder="what it taught us, or: none - <why not>" />
            <div class="close-actions">
              <button class="cf-go">save</button>
              <button class="cf-no">cancel</button>
            </div>
            <div class="cf-err"></div>
          </div>`;
        const ev = card.querySelector(".cf-ev");
        ev.focus();
        card.querySelector(".cf-no").onclick = () => { card.innerHTML = ""; };
        card.querySelector(".cf-go").onclick = () =>
          post(repo, status, { evidence: ev.value, lesson: card.querySelector(".cf-le").value },
               (msg) => { card.querySelector(".cf-err").textContent = msg; });
      }

      async function post(repo, status, fields, onError) {
        try {
          const r = await fetch("/api/radar/status", { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ project: CURRENT_PROJECT, repo, status, ...fields }) });
          if (!r.ok) throw new Error((await r.json()).error || "API " + r.status);
          load(CURRENT_PROJECT);
        } catch (e) {
          // The server's refusal names exactly what is missing - show it where
          // the operator is typing, not in a modal they have to dismiss first.
          if (onError) onError(e.message);
          else alert("Status update failed: " + e.message);
        }
      }

      function setStatus(repo, status) {
        if (CLOSING.has(status)) return closeForm(repo, status);
        return post(repo, status, {});
      }

      function load(project) {
        CURRENT_PROJECT = project;
        history.replaceState(null, "", `?project=${encodeURIComponent(project)}`);
        document.getElementById("root").innerHTML = `<div class="loading">Loading ${esc(project)} radar…</div>`;
        fetch(`/api/radar?project=${encodeURIComponent(project)}`)
          .then((r) => { if (!r.ok) throw new Error("API " + r.status); return r.json(); })
          .then(render)
          .catch((e) => {
            document.getElementById("root").innerHTML = `<div class="error">Failed to load radar: ${esc(e.message)}</div>`;
          });
      }

      fetch("/api/radar/projects").then((r) => r.json()).then(({ projects }) => {
        const sel = document.getElementById("project-select");
        sel.innerHTML = projects.map((p) => `<option value="${esc(p.id)}" ${p.id === CURRENT_PROJECT ? "selected" : ""}>${esc(p.title)} (${p.rows})</option>`).join("");
        sel.addEventListener("change", () => load(sel.value));
        load(CURRENT_PROJECT);
      });
    </script>
  </body>
</html>
