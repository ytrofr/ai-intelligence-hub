<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekly Digest — AI Intelligence Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root { --fg: #e8e8ea; --bg: #0f1116; --muted: #8b8fa0; --accent: #7aa2f7; --code-bg: #1a1d27; --border: #232634; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; line-height: 1.6; }
  .topbar { position: sticky; top: 0; background: rgba(15,17,22,0.95); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; gap: 12px; align-items: center; backdrop-filter: blur(8px); z-index: 10; }
  .topbar select, .topbar a { background: var(--code-bg); color: var(--fg); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 14px; }
  .topbar a:hover, .topbar select:hover { border-color: var(--accent); }
  .topbar .spacer { flex: 1; }
  main { max-width: 920px; margin: 0 auto; padding: 32px 24px 80px; }
  h1, h2, h3, h4 { color: #fff; line-height: 1.3; }
  h1 { font-size: 2em; border-bottom: 2px solid var(--border); padding-bottom: 12px; margin-top: 0; }
  h2 { font-size: 1.5em; margin-top: 2em; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  h3 { font-size: 1.2em; color: var(--accent); margin-top: 1.5em; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  blockquote { border-left: 4px solid var(--accent); padding: 4px 16px; color: var(--muted); margin: 16px 0; background: rgba(122,162,247,0.05); }
  code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
  pre { background: var(--code-bg); padding: 16px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); }
  pre code { background: transparent; padding: 0; }
  table { border-collapse: collapse; width: 100%; margin: 16px 0; }
  th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  th { background: var(--code-bg); }
  tr:nth-child(even) { background: rgba(255,255,255,0.02); }
  hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
  ul li { margin: 4px 0; }
  .err { color: #ef6b6b; padding: 24px; }
  .loading { color: var(--muted); padding: 24px; }
  .stamp { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="topbar">
  <strong>📰 Weekly Digest</strong>
  <select id="date-select" onchange="loadDigest(this.value)"><option>loading…</option></select>
  <span class="stamp" id="stamp"></span>
  <span class="spacer"></span>
  <a href="/" title="Hub home">← Hub</a>
  <a href="" id="raw-link" target="_blank">raw .md</a>
</div>
<main id="content"><div class="loading">Loading…</div></main>
<div id="deprecation-banner" style="position:fixed; top:0; left:0; right:0; background:rgba(122,162,247,0.18); border-bottom:1px solid var(--accent); color:var(--fg); padding:12px 24px; display:flex; gap:12px; align-items:center; font-size:14px; z-index:100;">
  <strong>This view moved.</strong>
  <span>The digest is now part of the main Hub UI. Redirecting in <span id="redirect-countdown">5</span>s…</span>
  <span style="flex:1;"></span>
  <a href="/?view=digests" style="background:var(--accent); color:#0f1116; border:none; padding:6px 12px; border-radius:6px; text-decoration:none; font-weight:600;">Go now</a>
  <button id="cancel-redirect" type="button" style="background:var(--code-bg); color:var(--fg); border:1px solid var(--border); padding:6px 12px; border-radius:6px; cursor:pointer; font:inherit;">Stay here</button>
</div>
<script>
(function(){
  var secs = 5;
  var counter = document.getElementById('redirect-countdown');
  var banner = document.getElementById('deprecation-banner');
  var cancel = document.getElementById('cancel-redirect');
  var t = setInterval(function(){
    secs -= 1;
    if (counter) counter.textContent = String(secs);
    if (secs <= 0) {
      clearInterval(t);
      var qs = window.location.search.replace(/^\?/, '');
      window.location.href = '/?view=digests' + (qs ? '&' + qs : '');
    }
  }, 1000);
  if (cancel) cancel.addEventListener('click', function(){
    clearInterval(t);
    if (banner) banner.style.display = 'none';
  });
})();
</script>
<script>
async function loadList() {
  const r = await fetch('/api/digest');
  const j = await r.json();
  const sel = document.getElementById('date-select');
  sel.innerHTML = '';
  if (!j.digests || j.digests.length === 0) {
    sel.innerHTML = '<option>(no digests yet)</option>';
    document.getElementById('content').innerHTML = '<div class="err">No digests on disk. Run <code>bash ~/.claude/scripts/hub-weekly-digest.sh</code> to generate one.</div>';
    return;
  }
  j.digests.forEach(f => {
    const date = f.replace('weekly-', '').replace('.md', '');
    const opt = document.createElement('option');
    opt.value = date; opt.textContent = date;
    sel.appendChild(opt);
  });
  const requested = new URLSearchParams(location.search).get('date');
  const pick = (requested && j.digests.includes(`weekly-${requested}.md`)) ? requested : sel.options[0].value;
  sel.value = pick;
  loadDigest(pick);
}
async function loadDigest(date) {
  document.getElementById('stamp').textContent = '';
  document.getElementById('raw-link').href = `/api/digest/${date}`;
  history.replaceState(null, '', `/digest.html?date=${date}`);
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const r = await fetch(`/api/digest/${date}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const md = await r.text();
    c.innerHTML = marked.parse(md);
    const lines = md.split('\n').length;
    document.getElementById('stamp').textContent = `${md.length.toLocaleString()} chars · ${lines} lines`;
  } catch (e) {
    c.innerHTML = `<div class="err">Failed to load digest for ${date}: ${e.message}</div>`;
  }
}
loadList();
</script>
</body>
</html>
