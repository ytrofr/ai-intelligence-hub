# The repo's first CI.
#
# A local hook is not cloned, so it guards only the machine it was written on.
# For a PUBLIC repo the only gate that actually holds is one that runs on
# GitHub's side of the fence - which is why the de-identification guard
# (tests/no-internal-identity.test.js) is worth nothing until this file exists.
#
# It runs on a checkout with NO config/projects.json - that file is gitignored
# and has never been pushed. So a green run here is also the proof that the
# suite is hermetic: any test that only passes because the real config happened
# to be sitting on the developer's disk fails here, loudly, in public.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 24, and not by preference. Node 24.20.0 aborts at process
          # exit with
          #   node::RemoveEnvironmentCleanupHook(...) at ../src/api/hooks.cc:142
          # in any test file that loads better-sqlite3 - AFTER every assertion
          # in it has passed. `node --test` reports that as a file-level
          # failure, so six green files read as six failures and the run is red
          # for a reason that has nothing to do with the diff.
          #
          # That is worse than an ordinary flake: this workflow is the ONLY gate
          # on the de-identification guard, and a permanently red run is a gate
          # nobody reads. It hid a real finding for three pushes on 2026-09-05:
          # the guard named the offending file and the offending id, in public,
          # in the log, and it went unnoticed under the crashes. (This comment
          # does not repeat the id - the guard reads this file too, and was
          # right to.)
          #
          # Local 24.18.0 does not abort; 24.20.0 does. Revisit when
          # better-sqlite3 ships a build that survives Node 24's teardown.
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix web ci --no-audit --no-fund
      # Builds before testing: dist/ is gitignored, and one of the guards
      # asserts the capture tag survives into the BUILT artifact, not just the
      # source. Without a build that cell reports SKIPPED forever.
      - run: npm --prefix web run build
      - run: npm test
